name: Gerar APK a partir do ZIP
on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
      - name: Descompactar o projeto
        run: |
          set -e
          unzip -q -o ./*.zip -d projeto
          DIR=$(dirname "$(find projeto -name settings.gradle.kts | head -1)")
          echo "PROJ=$DIR" >> "$GITHUB_ENV"
          echo "Projeto em: $DIR"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Testes (nao bloqueiam o APK)
        continue-on-error: true
        working-directory: ${{ env.PROJ }}
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Compilar APK
        working-directory: ${{ env.PROJ }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Curare-v1.1-APK-debug
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
